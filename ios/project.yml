name: GameplanIOS
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'

targets:
  Gameplan:
    type: application
    platform: iOS
    sources:
      - path: Gameplan
        excludes:
          - Resources/Config.xcconfig
    configFiles:
      Debug: Gameplan/Resources/Config.xcconfig
      Release: Gameplan/Resources/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.frappe.gameplan
        PRODUCT_NAME: Gameplan
        SWIFT_VERSION: 5.10
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gameplan
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppTransportSecurity_NSExceptionDomains_gameplan.frappe.test_NSExceptionAllowsInsecureHTTPLoads: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSExceptionDomains_gameplan.frappe.test_NSIncludesSubdomains: YES

  GameplanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GameplanTests
    dependencies:
      - target: Gameplan

schemes:
  Gameplan:
    build:
      targets:
        Gameplan: all
        GameplanTests: [test]
    test:
      targets:
        - GameplanTests
